name: probe-store

# Prueba puntual de acceso a una tienda desde un runner de GitHub (robots.txt respetado; nada se guarda).
on:
  push:
    paths: [".github/workflows/probe-store.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Madrid Hifi
        run: |
          python - <<'PY'
          from scraper.fetch import Fetcher, is_challenge
          f = Fetcher()
          for url in ["https://www.madridhifi.com/robots.txt", "https://www.madridhifi.com/sitemap.xml", "https://www.madridhifi.com/"]:
              try:
                  r = f.get(url)
                  print(url, "HTTP", r.status_code, len(r.content), "CHALLENGE" if is_challenge(r) else "", r.text[:200].replace("\n", " "))
              except Exception as e:
                  print(url, "ERROR", type(e).__name__, e)
          PY
