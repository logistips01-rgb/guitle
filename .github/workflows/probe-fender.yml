name: probe-fender

# Prueba puntual: ¿responde el sitemap de es.fender.com desde un runner de GitHub? (robots.txt respetado)
on:
  push:
    paths: [".github/workflows/probe-fender.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Prueba de scraper.pvp (2 minutos, sin guardar)
        run: |
          python -m scraper.pvp --minutes 2 --out /tmp/pvp.json
          python -c "import json; b=json.load(open('/tmp/pvp.json')); r=[x for x in b['records'] if x['offers']]; print(len(b['urls']), 'URLs;', [(x['url'][-40:], list(x['offers'].items())[:3]) for x in r[:6]])"
