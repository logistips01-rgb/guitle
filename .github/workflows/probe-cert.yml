name: probe-cert

# Prueba puntual: certificado HTTPS de guitle.com visto desde fuera.
on:
  push:
    paths: [".github/workflows/probe-cert.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Certificado
        run: |
          for h in guitle.com www.guitle.com; do
            echo "== $h"
            echo | openssl s_client -connect $h:443 -servername $h 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName
            curl -sS -o /dev/null -w "curl: %{http_code} ssl_verify=%{ssl_verify_result}\n" https://$h/
          done
