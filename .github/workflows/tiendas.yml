name: tiendas

# A mano (o al cambiar la propia prueba): prueba desde GitHub las tiendas que no podemos leer (_interno/tiendas-bloqueadas.md) y deja el informe
# en el resumen del trabajo y como fichero descargable. No cambia nada del repositorio.
on:
  workflow_dispatch:
  push:
    paths: ["scraper/probe.py", ".github/workflows/tiendas.yml"]

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Probar tiendas
        run: |
          # Bélgica, Polonia y nórdicos (7-11-2026): candidatas para llenar sus catálogos.
          python -m scraper.probe --out t1.md --domains bax-shop.be muziker.be musicstore.com keymusic.com keymusic.be omega.be \
            gear4music.be muziker.pl gear4music.pl riff.net.pl musicmarket.pl lutnia.pl skladmuzyczny.pl supersound.pl \
            musicexpress.pl imperiummuzyki.pl megamusic.pl gitarzysta.pl guitarcenter.pl studiomusic.pl dreamsound.pl \
            guitarway.pl soundcreation.pl || true
          python -m scraper.probe --out t2.md --domains gear4music.se 4sound.se musikborsen.se muziker.se soundstorexl.se \
            gear4music.dk 4sound.dk soundstorexl.dk hertzmusic.dk aagejensen.dk muziker.dk gear4music.no muziker.no \
            4sound.no || true
          echo > t3.md
          cat t1.md t2.md t3.md > informe-tiendas.md
          cat informe-tiendas.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: informe-tiendas
          path: informe-tiendas.md
