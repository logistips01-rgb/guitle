name: tiendas

# A mano (o al cambiar la propia prueba): prueba desde GitHub las tiendas que no podemos leer (_interno/tiendas-bloqueadas.md) y deja el informe
# en el resumen del trabajo y como fichero descargable. No cambia nada del repositorio.
on:
  workflow_dispatch:
  push:
    paths: ["scraper/probe.py", ".github/workflows/tiendas.yml"]

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Probar tiendas
        run: |
          # Brasil: ¿por qué el sitemap de Teclacenter sale vacío desde GitHub?, ¿se leen sus fichas y las de Multisom?,
          # y tiendas brasileñas aún sin probar.
          python -m scraper.probe --out t1.md --sitemap https://www.teclacenter.com.br/google_sitemap_1.xml || true
          python -m scraper.probe --out t2.md --only-try --try br:teclacenter br:multisom || true
          python -m scraper.probe --out t3.md --domains musicalexpress.com.br playtech.com.br contemporanea.com.br \
            izzomusical.com.br madeinbrazil.com.br gang.com.br || true
          cat t1.md t2.md t3.md > informe-tiendas.md
          cat informe-tiendas.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: informe-tiendas
          path: informe-tiendas.md
