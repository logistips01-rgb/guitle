name: cloudflare

# Despliega el Worker que sirve guitle.com desde R2 (cloudflare/worker.js y wrangler.toml).
# Necesita el secreto CLOUDFLARE_API_TOKEN (plantilla "Editar Cloudflare Workers") y R2_ACCOUNT_ID.
on:
  push:
    branches: [claude/friendly-fermat-yycain]
    paths: ["cloudflare/**", ".github/workflows/cloudflare.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            cloudflare
            .github
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Desplegar el Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
        working-directory: cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Falta el secreto CLOUDFLARE_API_TOKEN: no se despliega."; exit 0; fi
          export CLOUDFLARE_ACCOUNT_ID="${ACCOUNT,,}"
          npx --yes wrangler@4.20.0 deploy
