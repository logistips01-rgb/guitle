name: rehacer-fotos

# Rehace las miniaturas de data/fotos-malas.txt (cortadas o partidas) con la foto actual de la tienda y el recorte de
# hoy (python -m scraper.thumbs --rehacer). Las que salen enteras se suben a R2 con otro nombre ("-2"), para que nadie
# siga viendo la vieja en su caché, y salen de la lista; las demás siguen fuera de la portada. Se lanza tocando
# .github/rehacer.txt.
on:
  push:
    branches: [claude/friendly-fermat-yycain]
    paths: [".github/rehacer.txt"]
  workflow_dispatch:

concurrency:
  group: rehacer-fotos
  cancel-in-progress: false

permissions:
  contents: write
  actions: write  # r2.sh lanza r2.yml

jobs:
  rehacer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
      SERVIDOR_SSH_KEY: ${{ secrets.SERVIDOR_SSH_KEY }}  # lo publicado, también al servidor propio (.github/servidor-envio.sh)
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/friendly-fermat-yycain
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rehacer y subir
        run: |
          python -m scraper.thumbs --rehacer
          ls img/p/*.webp >/dev/null 2>&1 || { echo "Ninguna rehecha"; exit 0; }
          bash .github/r2.sh publicar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/fotos-malas.txt data/fotos-rehechas.json "$RUNNER_TEMP/"
          for attempt in $(seq 40); do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            cp "$RUNNER_TEMP/fotos-malas.txt" "$RUNNER_TEMP/fotos-rehechas.json" data/
            python -m scraper.thumbs --index
            git add data/fotos-malas.txt data/fotos-rehechas.json data/thumbs.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m "data: miniaturas rehechas $(TZ=Europe/Madrid date +%F)"
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $(( 5 + RANDOM % 40 ))
          done
          exit 1
