name: fotos

# Miniaturas de las fotos de producto que faltan, en las máquinas que deja libres la lectura del catálogo. La lectura
# solo baja fotos con el tiempo que le sobra (como mucho 50 min) y en los países grandes casi nunca sobra: aquí se
# bajan entre vuelta y vuelta, hasta 40 min antes de la siguiente (03:17, 11:17 y 19:17 UTC) para no retrasarla.
# Cada tienda, con sus pausas de siempre (1-2 s, o lo que pida su robots.txt). Al acabar, se reconstruyen las webs del
# país con sus fotos nuevas y todo va a R2 (.github/r2.sh).
on:
  workflow_run:
    workflows: [catalog]
    types: [completed]
  push:
    branches: [claude/friendly-fermat-yycain]
    paths: [".github/workflows/fotos.yml"]
  workflow_dispatch:

concurrency:
  group: fotos
  cancel-in-progress: false

permissions:
  contents: write
  actions: write  # r2.sh lanza r2.yml

jobs:
  fotos:
    # Tras la vuelta programada (no tras la primera lectura de un país nuevo, que va en paralelo a otra).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'schedule'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        # Los países con más fichas sin foto; cada uno, sus guitarras y su equipo ("<país>mas").
        pais: [uk, fr, nl, it, ie, de, br]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/friendly-fermat-yycain

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Bajar fotos
        run: |
          # Minutos hasta la próxima vuelta del catálogo, menos 40 de margen; como mucho 100 (2/3 guitarras, 1/3 equipo).
          # Si algo falla, no se pierde nada: las fotos que falten se bajan en la pasada siguiente.
          now=$(( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) ))
          next=$(for h in 3 11 19 27; do m=$(( h * 60 + 17 )); [ $m -gt $now ] && echo $m && break; done)
          min=$(( next - now - 40 )); [ $min -gt 100 ] && min=100
          if [ $min -lt 15 ]; then echo "::warning::sin tiempo antes de la próxima lectura"; exit 0; fi
          g=$(( min * 2 / 3 )); e=$(( min - g ))
          bash .github/r2.sh reparar || echo "::warning::no se pudo comprobar img/p en R2"  # fotos apuntadas y sin subir
          echo "fotos de ${{ matrix.pais }}: $g + $e min"
          timeout $(( g + 5 ))m python -m scraper.thumbs --limit 100000 --minutes "$g" --cat "${{ matrix.pais }}" || true
          timeout $(( e + 5 ))m python -m scraper.thumbs --limit 100000 --minutes "$e" --cat "${{ matrix.pais }}mas" || true

      - name: Guardar y publicar
        run: |
          ls img/p/*.webp >/dev/null 2>&1 || { echo "Sin fotos nuevas"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            bash .github/r2.sh reparar || true
            # Las fotos nuevas (img/p/, fuera de git) siguen en disco: los JSON y las páginas del país las recogen.
            python -m scraper.catalog --cat "${{ matrix.pais }}" --build
            python -m scraper.catalog --cat "${{ matrix.pais }}mas" --build
            bash .github/r2.sh git-add data/catalog/
            if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
            git commit -q -m "data: fotos ${{ matrix.pais }} $(TZ=Europe/Madrid date +%F)"
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              bash .github/r2.sh publicar
              exit 0
            fi
            echo "push rechazado, reintento $attempt"; sleep $((attempt * 5))
          done
          exit 1
