name: publicar

# Genera la web de unos países con lo que ya hay en data/ y la sube a R2, sin leer las tiendas: para publicar enseguida
# un país leído fuera de la vuelta (p. ej. su primera lectura). Se lanza tocando .github/publicar.txt, que lista los
# países separados por espacios (cada uno con su equipo, "<país>mas").
on:
  push:
    branches: [claude/friendly-fermat-yycain]
    paths: [".github/publicar.txt"]
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # r2.sh lanza r2.yml

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      paises: ${{ steps.lista.outputs.paises }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - id: lista
        run: |
          echo "paises=$(grep -v '^#' .github/publicar.txt | tr ' ' '\n' | grep -E '^[a-z]{2}$' | python3 -c 'import sys,json;print(json.dumps(sys.stdin.read().split()))')" >> "$GITHUB_OUTPUT"

  publicar:
    needs: plan
    if: needs.plan.outputs.paises != '[]'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pais: ${{ fromJSON(needs.plan.outputs.paises) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/friendly-fermat-yycain
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generar y subir
        run: |
          python -m scraper.catalog --cat "${{ matrix.pais }}" --build
          python -m scraper.catalog --cat "${{ matrix.pais }}mas" --build || echo "::warning::sin equipo todavía"
          bash .github/r2.sh publicar
