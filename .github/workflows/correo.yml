name: correo

# Correo comercial desde hola@guitle.com (scraper/correo.py): los ficheros de _interno/comercial/correo/borradores/ se
# guardan como borrador en el buzón; los de enviar/ se envían (solo cuando Manuel dice «envía»). Sin duplicados: cada
# correo lleva un Message-ID fijo. En el registro no salen direcciones, textos ni claves.
on:
  push:
    branches: [claude/friendly-fermat-yycain]
    paths: ["_interno/comercial/correo/**", "scraper/correo.py", ".github/workflows/correo.yml"]
  workflow_dispatch:

concurrency:
  group: correo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  correo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scraper/correo.py
            _interno/comercial/correo
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Borradores y envíos
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
        run: python -u scraper/correo.py
