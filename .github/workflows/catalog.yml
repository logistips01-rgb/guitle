name: catalog

on:
  schedule:
    # De madrugada, fuera de la hora del rastreador de precios (03:17 UTC).
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutos de lectura por tienda (la primera carga completa necesita ~300)"
        default: "50"

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Leer fichas (lote del día)
        # Cada tienda va en paralelo y a su ritmo (3-6 s entre peticiones, robots.txt respetado).
        run: python -m scraper.catalog --minutes "${{ inputs.minutes || '50' }}" --records-out "$RUNNER_TEMP/catalog.json" || echo "::warning::catálogo con error; se commitea lo que haya"

      - name: Miniaturas de fotos
        # Primero se fusiona el lote (para conocer las fotos nuevas) y luego se generan sus miniaturas.
        # Los ficheros nuevos de img/p/ no están en git y sobreviven al reset del paso siguiente.
        run: |
          [ -f "$RUNNER_TEMP/catalog.json" ] && python -m scraper.catalog --merge "$RUNNER_TEMP/catalog.json"
          python -m scraper.thumbs --limit 4000 --minutes 40 || echo "::warning::miniaturas con error"

      - name: Commit de datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f "$RUNNER_TEMP/catalog.json" ] || exit 0
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            python -m scraper.catalog --merge "$RUNNER_TEMP/catalog.json"  # también reconstruye products.json con las miniaturas
            git add data/catalog/ img/p/
            if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
            git commit -q -m "data: catálogo $(TZ=Europe/Madrid date +%F)"
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push rechazado, reintento $attempt"; sleep $((attempt * 5))
          done
          exit 1
