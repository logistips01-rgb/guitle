name: catalog

on:
  schedule:
    # De madrugada, fuera de la hora del rastreador de precios (03:17 UTC).
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutos de lectura por tienda (la primera carga completa necesita ~300)"
        default: "50"
      solo:
        description: "Qué catálogo leer (todos, o solo uno)"
        type: choice
        default: todos
        options: [todos, equipo, electrica, acustica, pt, fr, it]

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  catalog:
    # Un catálogo detrás de otro (max-parallel 1): cada tienda recibe como mucho una petición cada 3-6 s.
    # electrica → data/catalog/ ; acustica → data/catalog/acusticas/ (acústicas y clásicas en una sola lectura) ;
    # equipo → data/catalog/equipo/ (teclados y pedales) ; pt → data/catalog/pt/ (Portugal) ; fr → data/catalog/fr/ (Francia) ; it → data/catalog/it/ (Italia)
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        # Programada: todos. A mano se puede elegir uno solo (p. ej. equipo = pedales y teclados).
        cat: ${{ fromJSON(inputs.solo && inputs.solo != 'todos' && format('["{0}"]', inputs.solo) || '["electrica","acustica","equipo","pt","fr","it"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Leer fichas (lote del día)
        # Cada tienda va en paralelo y a su ritmo (3-6 s entre peticiones, robots.txt respetado).
        run: python -m scraper.catalog --cat ${{ matrix.cat }} --minutes "${{ inputs.minutes || '50' }}" --records-out "$RUNNER_TEMP/catalog.json" || echo "::warning::catálogo con error; se commitea lo que haya"

      - name: PVP oficial de las marcas
        # Fender (es.fender.com, solo responde desde aquí) 40 min; luego Gibson/Epiphone 15 y Jackson 8.
        # robots.txt respetado, 3-6 s entre peticiones.
        if: matrix.cat == 'electrica'
        run: python -m scraper.pvp --minutes 40 --out "$RUNNER_TEMP/pvp.json" || echo "::warning::PVP de las marcas con error"

      - name: Miniaturas de fotos
        # Primero se fusiona el lote (para conocer las fotos nuevas) y luego se generan sus miniaturas.
        # Los ficheros nuevos de img/p/ no están en git y sobreviven al reset del paso siguiente.
        run: |
          [ -f "$RUNNER_TEMP/catalog.json" ] && python -m scraper.catalog --cat ${{ matrix.cat }} --merge "$RUNNER_TEMP/catalog.json"
          # El tiempo que deje la lectura, sin pasar de 150 min (el job tiene 355 en total).
          read_min=${{ inputs.minutes || '50' }}
          thumb_min=$(( 320 - read_min )); [ $thumb_min -gt 150 ] && thumb_min=150; [ $thumb_min -lt 10 ] && thumb_min=10
          python -m scraper.thumbs --limit 5000 --minutes "$thumb_min" || echo "::warning::miniaturas con error"

      - name: Commit de datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f "$RUNNER_TEMP/catalog.json" ] || exit 0
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            [ -f "$RUNNER_TEMP/pvp.json" ] && python -m scraper.pvp --merge "$RUNNER_TEMP/pvp.json"  # PVP al histórico, antes de construir
            python -m scraper.catalog --cat ${{ matrix.cat }} --merge "$RUNNER_TEMP/catalog.json"  # también reconstruye los JSON de la web
            python -m scraper.checks || echo "::warning::comprobaciones con error"  # avisos de precios y fotos raros
            git add data/catalog/ data/deals-*.json data/checks.json img/p/ g/ marca/ tipo/ presupuesto/ marcas.html sitemap.xml
            # Webs de otros países (pt/, fr/…) y sus sitemaps, si ya existen.
            for d in sitemap-*.xml $(python -c "from scraper.intl import SITES; print(' '.join(SITES))"); do
              if [ -e "$d" ]; then git add "$d"; fi
            done
            if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
            git commit -q -m "data: catálogo ${{ matrix.cat }} $(TZ=Europe/Madrid date +%F)"
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then python -m scraper.indexnow || true; exit 0; fi
            echo "push rechazado, reintento $attempt"; sleep $((attempt * 5))
          done
          exit 1
