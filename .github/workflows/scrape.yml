name: scrape-prices

on:
  schedule:
    # GitHub cron va en UTC: 07:00 UTC = 09:00 en verano (CEST), 08:00 UTC = 09:00 en invierno (CET).
    # Se disparan ambas y el primer paso deja pasar solo la que cae a las 09 en Madrid.
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:
  # Al cambiar el workflow o el scraper se ejecuta una vez para validarlo.
  push:
    paths:
      - ".github/workflows/scrape.yml"
      - "scraper/**"
      - "stores.json"
      - "sneakers_stores.json"

permissions:
  contents: write

concurrency:
  group: scrape-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ¿Son las 09 en Madrid?
        id: gate
        run: |
          hour=$(TZ=Europe/Madrid date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" != "09" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Hora Madrid $hour, se omite."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Scraper
        if: steps.gate.outputs.run == 'true'
        # Las tiendas que fallan quedan registradas con su status; el job no debe romperse por ellas.
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python -m scraper.run --records-out "$RUNNER_TEMP/records.json" || echo "::warning::scraper terminó con error; se commitea lo que haya"

      - name: Diagnóstico eBay (vendedores)
        if: steps.gate.outputs.run == 'true'
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python -m scraper.ebay || echo "::warning::diagnóstico eBay con error"

      - name: Scraper Jordan
        if: steps.gate.outputs.run == 'true'
        run: python -m scraper.sneakers --records-out "$RUNNER_TEMP/sneakers.json" || echo "::warning::scraper de Jordan terminó con error"

      - name: Commit de datos
        if: steps.gate.outputs.run == 'true'
        # Se fusiona sobre la última versión de la rama (otra ejecución o un push pueden haber llegado antes).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f "$RUNNER_TEMP/records.json" ] || echo "[]" > "$RUNNER_TEMP/records.json"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            python -m scraper.run --merge "$RUNNER_TEMP/records.json"
            [ -f "$RUNNER_TEMP/sneakers.json" ] && python -m scraper.sneakers --merge "$RUNNER_TEMP/sneakers.json"
            git add data/
            if git diff --cached --quiet; then echo "Sin cambios en data/"; exit 0; fi
            git commit -q -m "data: precios $(TZ=Europe/Madrid date +%F)"
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push rechazado, reintento $attempt"; sleep $((attempt * 5))
          done
          exit 1
