<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquetas guitle</title>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f4f4f2; --surface-1: #fcfcfb; --border: #e2e1dc; --grid: #ecebe7;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7974;
    --good: #00750a; --good-bg: #e6f4e8; --critical: #c62828; --accent: #2a78d6; --accent-bg: #e8f1fc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-0: #111110; --surface-1: #1a1a19; --border: #2e2e2c; --grid: #262624;
      --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e88;
      --good: #4cc261; --good-bg: #16301b; --critical: #f07070; --accent: #3987e5; --accent-bg: #172a40;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #111110; --surface-1: #1a1a19; --border: #2e2e2c; --grid: #262624;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e88;
    --good: #4cc261; --good-bg: #16301b; --critical: #f07070; --accent: #3987e5; --accent-bg: #172a40;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface-0); color: var(--text-primary); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 0 16px 48px; }
  .topbar { position: sticky; top: 0; z-index: 5; background: var(--surface-0); padding: 14px 0 10px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 1.3rem; margin: 0; flex: 1; white-space: nowrap; }
  @media (max-width: 520px) { h1 .muted { display: none; } .switch button { padding: 6px 10px; font-size: .85rem; } }
  .switch { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
  .switch button { font: inherit; border: 0; background: var(--surface-1); color: var(--text-secondary); padding: 6px 14px; cursor: pointer; }
  .switch button.on { background: var(--accent); color: #fff; }
  .search { width: 100%; font: inherit; font-size: 1.05rem; padding: 11px 16px; margin: 10px 0 8px; border-radius: 999px;
            border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); outline: none; }
  .search:focus { border-color: var(--accent); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .chip { flex: none; font: inherit; font-size: .88rem; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border);
          background: var(--surface-1); color: var(--text-secondary); cursor: pointer; }
  .chip.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
  .meta { color: var(--text-muted); font-size: .88rem; margin: 0 0 12px; }
  .badge { display: inline-block; font-size: .74rem; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: var(--good-bg); color: var(--good); }
  .badge.low { background: #fff1e0; color: #a35a00; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge.low { background: #3a2a12; color: #f0b25a; } }
  .muted { color: var(--text-muted); }
  .neg { color: var(--good); font-weight: 600; }
  .fav { border: 0; background: none; cursor: pointer; font-size: 1.15rem; line-height: 1; padding: 2px; color: var(--text-muted); }
  .fav.on { color: #e5a400; }

  /* ---------- A: escaparate ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .tile { position: relative; background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; cursor: pointer;
          display: flex; flex-direction: column; transition: transform .12s, box-shadow .12s; }
  .tile:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.08); }
  .tile .img { aspect-ratio: 4 / 3; background: #fff; display: flex; align-items: center; justify-content: center; }
  .tile img { max-width: 92%; max-height: 92%; object-fit: contain; }
  .tile .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .tile .brand { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); }
  .tile .name { font-weight: 600; line-height: 1.25; }
  .tile .price { display: flex; align-items: baseline; gap: 8px; margin-top: auto; }
  .tile .price strong { font-size: 1.3rem; }
  .tile .foot { display: flex; justify-content: space-between; align-items: center; color: var(--text-muted); font-size: .82rem; }
  .tile .fav { position: absolute; top: 8px; right: 8px; background: var(--surface-1); border-radius: 999px; width: 30px; height: 30px; }
  .tile .badges { position: absolute; top: 8px; left: 8px; display: flex; flex-direction: column; gap: 4px; }
  svg.spark { width: 70px; height: 22px; }

  /* Panel de detalle */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; display: none; }
  .sheet { position: fixed; z-index: 21; background: var(--surface-1); display: none; overflow-y: auto;
           inset: auto 0 0 0; max-height: 92vh; border-radius: 18px 18px 0 0; padding: 18px 18px 28px; }
  @media (min-width: 760px) { .sheet { inset: 5vh auto auto 50%; transform: translateX(-50%); width: 720px; border-radius: 18px; max-height: 90vh; } }
  .sheet.open, .sheet-bg.open { display: block; }
  .sheet .close { float: right; border: 0; background: var(--surface-0); border-radius: 999px; width: 32px; height: 32px; font-size: 1.1rem; cursor: pointer; color: var(--text-primary); }
  .sheet .hero { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin: 8px 0 12px; }
  .sheet .hero img { width: 200px; height: 160px; object-fit: contain; background: #fff; border-radius: 12px; border: 1px solid var(--border); }
  .sheet h2 { margin: 0 0 4px; font-size: 1.2rem; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 8px; border-bottom: 1px solid var(--grid); text-align: left; white-space: nowrap; }
  th { font-size: .82rem; color: var(--text-secondary); }
  td.num, th.num { text-align: right; }
  .best-row td { background: var(--good-bg); }

  /* ---------- B: matriz ---------- */
  .matrix-wrap { overflow-x: auto; background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; }
  .matrix th, .matrix td { padding: 8px 10px; }
  .matrix thead th { position: sticky; top: 0; background: var(--surface-1); font-size: .8rem; text-align: right; }
  .matrix thead th:first-child { text-align: left; }
  .matrix td.prod { position: sticky; left: 0; background: var(--surface-1); min-width: 230px; white-space: normal; }
  .matrix td.prod .pn { display: flex; align-items: center; gap: 8px; }
  .matrix td.prod img { width: 36px; height: 36px; object-fit: contain; background: #fff; border-radius: 6px; border: 1px solid var(--border); }
  .matrix td.cell { text-align: right; color: var(--text-secondary); }
  .matrix td.cell.win { background: var(--good-bg); color: var(--good); font-weight: 700; }
  .matrix td.cell.none { color: var(--border); }
  .matrix tr.sum td { font-weight: 600; color: var(--text-secondary); border-top: 2px solid var(--border); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div class="row">
      <h1>🎸 guitle <span class="muted" style="font-weight:400;font-size:.9rem">maquetas</span></h1>
      <div class="switch"><button id="vA" class="on">A · Escaparate</button><button id="vB">B · Comparador</button></div>
    </div>
    <input class="search" id="q" type="search" placeholder="Busca: tele negra, strat, les paul, casino…" autocomplete="off">
    <div class="chips" id="chips"></div>
  </div>
  <p class="meta" id="meta"></p>
  <div id="A" class="grid"></div>
  <div id="B" class="matrix-wrap hidden"><table class="matrix" id="matrix"></table></div>
</main>
<div class="sheet-bg" id="bg"></div>
<div class="sheet" id="sheet"></div>
<script>
const eur = v => v == null ? "–" : v.toLocaleString("es-ES", { style: "currency", currency: "EUR", maximumFractionDigits: v % 1 ? 2 : 0 });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
const FAV_KEY = "guitle.favs";
let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || "[]")); } catch (e) {}
const saveFavs = () => { try { localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); } catch (e) {} };

const CHIPS = [
  ["fav", "⭐ Favoritas", p => favs.has(p.sku)],
  ["Fender", "Fender", p => p.brand === "Fender"], ["Epiphone", "Epiphone", p => p.brand === "Epiphone"],
  ["Gibson", "Gibson", p => p.brand === "Gibson"], ["Ibanez", "Ibanez", p => p.brand === "Ibanez"],
  ["tele", "Tele", p => /telecaster/i.test(p.name)], ["strat", "Strat", p => /stratocaster/i.test(p.name)],
  ["lp", "Les Paul", p => /les paul/i.test(p.name)], ["semi", "Semihuecas", p => /es-335|casino|as73/i.test(p.name)],
  ["600", "< 600 €", p => p.best && p.best.price < 600], ["drop", "⬇️ Han bajado", p => p.drop > 0],
  ["low", "🔥 Mínimo histórico", p => p.atLow],
];

function sparkline(points) {
  if (points.length < 2 || Math.min(...points) === Math.max(...points)) return "";
  const min = Math.min(...points), max = Math.max(...points), w = 70, h = 22;
  const xy = points.map((v, i) => `${(i / (points.length - 1)) * w},${max === min ? h / 2 : h - 2 - ((v - min) / (max - min)) * (h - 4)}`);
  const down = points.at(-1) < points[0];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${down ? "var(--good)" : "var(--text-muted)"}" stroke-width="2" points="${xy.join(" ")}"/></svg>`;
}

function build(latest, history) {
  const stores = latest.stores.filter(s => !s.reference);
  const storeName = Object.fromEntries(latest.stores.map(s => [s.id, s.name]));
  const isRef = Object.fromEntries(latest.stores.map(s => [s.id, !!s.reference]));
  return latest.products.filter(p => p.category === "guitarra").map(p => {
    const items = latest.items.filter(i => i.sku === p.sku && !isRef[i.store] && i.price != null);
    items.sort((a, b) => a.price - b.price);
    const best = items[0] || null;
    // Serie del mejor precio por día (histórico de todas las tiendas, sin la de referencia)
    const byDay = {};
    for (const r of history) if (r.sku === p.sku && r.status === "ok" && !isRef[r.store] && r.price) {
      const d = r.date.slice(0, 10); byDay[d] = Math.min(byDay[d] ?? Infinity, r.price);
    }
    const days = Object.keys(byDay).sort(), series = days.map(d => byDay[d]);
    const drop = series.length > 1 ? Math.max(0, series.at(-2) - series.at(-1)) : 0;
    // "Mínimo histórico" solo si hoy está por debajo de todo lo visto antes (y hay unos días de datos).
    const prevMin = series.length > 2 ? Math.min(...series.slice(0, -1)) : null;
    return { ...p, items, best, series, drop, atLow: best && prevMin != null && best.price < prevMin,
             pct: best && p.pvp ? (best.price - p.pvp) / p.pvp * 100 : null,
             search: norm([p.name, p.brand, p.sku].join(" ") + (/black|ebony/i.test(p.name) ? " negra" : "") + (/white/i.test(p.name) ? " blanca" : "")) };
  }).filter(p => p.best);
}

function tileHTML(p, storeName) {
  const badges = [p.atLow ? '<span class="badge low">🔥 Mínimo</span>' : "", p.drop > 0 ? `<span class="badge">⬇️ −${eur(p.drop)}</span>` : ""].join("");
  return `<div class="tile" data-sku="${esc(p.sku)}">
    <div class="img">${p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ""}</div>
    <div class="badges">${badges}</div>
    <button class="fav ${favs.has(p.sku) ? "on" : ""}" data-fav="${esc(p.sku)}" aria-label="Favorita">${favs.has(p.sku) ? "★" : "☆"}</button>
    <div class="body">
      <span class="brand">${esc(p.brand)}</span>
      <span class="name">${esc(p.name.replace(new RegExp("^" + p.brand + " "), ""))}</span>
      <span class="price"><strong>${eur(p.best.price)}</strong>${p.pct != null && p.pct < 0 ? `<span class="neg">${p.pct.toFixed(0)} %</span>` : ""}</span>
      <span class="foot"><span>${esc(storeName[p.best.store])} · ${p.items.length} tienda${p.items.length > 1 ? "s" : ""}</span>${sparkline(p.series)}</span>
    </div></div>`;
}

function openSheet(p, storeName) {
  const s = document.getElementById("sheet");
  s.innerHTML = `<button class="close" aria-label="Cerrar">✕</button>
    <div class="hero">${p.image ? `<img src="${esc(p.image)}" alt="" referrerpolicy="no-referrer">` : ""}
      <div><h2>${esc(p.name)}</h2>
        <div style="font-size:1.6rem;font-weight:700">${eur(p.best.price)} <span class="muted" style="font-size:.95rem;font-weight:400">en ${esc(storeName[p.best.store])}</span></div>
        <div class="muted">PVP ${eur(p.pvp)} ${p.pct != null ? `· <span class="neg">${p.pct.toFixed(1)} %</span>` : ""}</div>
        <div style="margin-top:6px">${p.atLow ? '<span class="badge low">🔥 Mínimo histórico</span> ' : ""}${p.drop > 0 ? `<span class="badge">⬇️ Ha bajado ${eur(p.drop)}</span>` : ""}</div>
      </div></div>
    <table><thead><tr><th>Tienda</th><th class="num">Precio</th><th class="num">vs mejor</th><th>Stock</th></tr></thead><tbody>
    ${p.items.map((i, n) => `<tr class="${n === 0 ? "best-row" : ""}"><td><a href="${esc(i.url)}" target="_blank" rel="noopener" style="color:inherit">${esc(storeName[i.store])}</a></td>
      <td class="num">${eur(i.price)}</td><td class="num muted">${n === 0 ? "✓ mejor" : "+" + eur(i.price - p.best.price)}</td>
      <td>${i.in_stock === true ? "sí" : i.in_stock === false ? "no" : "?"}</td></tr>`).join("")}</tbody></table>
    <p class="muted" style="margin-top:12px">Aquí iría la gráfica del histórico y el pack con estuche (como en la página actual).</p>`;
  s.classList.add("open"); document.getElementById("bg").classList.add("open");
  const close = () => { s.classList.remove("open"); document.getElementById("bg").classList.remove("open"); };
  s.querySelector(".close").onclick = close; document.getElementById("bg").onclick = close;
}

function render(latest, history) {
  const storeName = Object.fromEntries(latest.stores.map(s => [s.id, s.name]));
  const products = build(latest, history);
  const active = new Set();
  const chips = document.getElementById("chips");
  chips.innerHTML = CHIPS.map(([id, label]) => `<button class="chip" data-chip="${id}">${label}</button>`).join("");
  chips.onclick = e => { const id = e.target.dataset.chip; if (!id) return; active.has(id) ? active.delete(id) : active.add(id); e.target.classList.toggle("on"); draw(); };
  const q = document.getElementById("q"); q.oninput = draw;
  let view = "A";
  document.getElementById("vA").onclick = () => { view = "A"; toggle(); };
  document.getElementById("vB").onclick = () => { view = "B"; toggle(); };
  function toggle() {
    document.getElementById("vA").classList.toggle("on", view === "A"); document.getElementById("vB").classList.toggle("on", view === "B");
    document.getElementById("A").classList.toggle("hidden", view !== "A"); document.getElementById("B").classList.toggle("hidden", view !== "B");
  }

  function draw() {
    const words = norm(q.value).split(" ").filter(Boolean);
    const list = products.filter(p => words.every(w => p.search.includes(w)) &&
      [...active].every(id => CHIPS.find(c => c[0] === id)[2](p)))
      .sort((a, b) => (favs.has(b.sku) - favs.has(a.sku)) || a.best.price - b.best.price);
    document.getElementById("meta").textContent = `${list.length} guitarras · actualizado ${new Date(latest.updated).toLocaleString("es-ES", { timeZone: "Europe/Madrid" })}`;

    // A
    const A = document.getElementById("A");
    A.innerHTML = list.map(p => tileHTML(p, storeName)).join("");
    A.onclick = e => {
      const fav = e.target.closest("[data-fav]");
      if (fav) { e.stopPropagation(); const s = fav.dataset.fav; favs.has(s) ? favs.delete(s) : favs.add(s); saveFavs(); draw(); return; }
      const t = e.target.closest(".tile"); if (t) openSheet(products.find(p => p.sku === t.dataset.sku), storeName);
    };

    // B: solo tiendas que tengan algún precio en la lista
    const cols = latest.stores.filter(s => !s.reference && list.some(p => p.items.some(i => i.store === s.id)));
    const wins = Object.fromEntries(cols.map(s => [s.id, 0]));
    const rows = list.map(p => {
      const by = Object.fromEntries(p.items.map(i => [i.store, i.price]));
      if (wins[p.best.store] !== undefined) wins[p.best.store]++;
      return `<tr><td class="prod"><span class="pn">${p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ""}
        <span><button class="fav ${favs.has(p.sku) ? "on" : ""}" data-fav="${esc(p.sku)}">${favs.has(p.sku) ? "★" : "☆"}</button> ${esc(p.name)}</span></span></td>
        ${cols.map(s => by[s.id] == null ? '<td class="cell none">·</td>'
          : `<td class="cell ${by[s.id] === p.best.price ? "win" : ""}">${eur(by[s.id])}</td>`).join("")}</tr>`;
    }).join("");
    document.getElementById("matrix").innerHTML =
      `<thead><tr><th>Guitarra</th>${cols.map(s => `<th>${esc(s.name)}</th>`).join("")}</tr></thead>
       <tbody>${rows}<tr class="sum"><td class="prod">Veces más barata</td>${cols.map(s => `<td class="cell">${wins[s.id] || ""}</td>`).join("")}</tr></tbody>`;
    document.getElementById("matrix").onclick = e => {
      const fav = e.target.closest("[data-fav]");
      if (fav) { const s = fav.dataset.fav; favs.has(s) ? favs.delete(s) : favs.add(s); saveFavs(); draw(); return; }
      const tr = e.target.closest("tr"); const name = tr && tr.querySelector(".prod span span");
      const p = name && list.find(x => name.textContent.includes(x.name)); if (p) openSheet(p, storeName);
    };
  }
  draw();
}

Promise.all([fetch("data/latest.json").then(r => r.json()), fetch("data/history.json").then(r => r.json())])
  .then(([l, h]) => render(l, h))
  .catch(e => { document.getElementById("meta").textContent = "No se pudieron cargar los datos: " + e.message; });
</script>
</body>
</html>
