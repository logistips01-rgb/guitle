<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Precios Jordan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f4f4f2; --surface-1: #fcfcfb; --border: #e2e1dc; --grid: #ecebe7;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7974;
    --good: #00750a; --critical: #c62828; --warning: #9a6400;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-0: #111110; --surface-1: #1a1a19; --border: #2e2e2c; --grid: #262624;
      --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e88;
      --good: #4cc261; --critical: #f07070; --warning: #e0a63a;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
      --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #111110; --surface-1: #1a1a19; --border: #2e2e2c; --grid: #262624;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e88;
    --good: #4cc261; --critical: #f07070; --warning: #e0a63a;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--surface-0); color: var(--text-primary);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1rem; margin: 0; }
  a { color: inherit; }
  .muted { color: var(--text-muted); }
  .sub { color: var(--text-secondary); margin: 0 0 16px; }
  .nav { float: right; font-size: .9rem; color: var(--text-secondary); }
  .search {
    width: 100%; font: inherit; font-size: 1.1rem; padding: 12px 16px; margin-bottom: 12px;
    color: var(--text-primary); background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 999px; outline: none;
  }
  .search:focus { border-color: var(--s1); }
  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; margin-bottom: 12px; color: var(--text-secondary); font-size: .9rem; }
  .filters select, .filters input[type=number] {
    margin-left: 6px; font: inherit; color: var(--text-primary); background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px;
  }
  .filters input[type=number] { width: 80px; }
  .count { color: var(--text-muted); font-size: .9rem; margin: 0 0 12px; }
  details.card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px;
  }
  details.card > summary {
    list-style: none; cursor: pointer; padding: 10px 14px;
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 16px;
  }
  details.card > summary::-webkit-details-marker { display: none; }
  details.card[open] > summary { border-bottom: 1px solid var(--grid); }
  .title { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 1 340px; }
  .thumb { width: 56px; height: 56px; object-fit: contain; background: #fff; border-radius: 8px; border: 1px solid var(--border); flex: none; }
  .best-line { color: var(--text-secondary); }
  .best-line strong { color: var(--text-primary); font-size: 1.05rem; }
  .tag { font-size: .78rem; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border); color: var(--text-secondary); white-space: nowrap; }
  .tag.ok { color: var(--good); border-color: currentColor; }
  .tag.no { color: var(--text-muted); text-decoration: line-through; }
  .neg { color: var(--good); }
  .detail { padding: 12px 14px 14px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th { color: var(--text-secondary); font-weight: 600; font-size: .85rem; }
  td.num, th.num { text-align: right; }
  .best { font-weight: 700; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  .chart-box { position: relative; height: 220px; margin-top: 12px; }
  .more[hidden] { display: none; }
  .more { display: block; margin: 12px auto; font: inherit; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); cursor: pointer; }
</style>
</head>
<body>
<main>
  <span class="nav"><a href="./">🎸 Guitarras</a></span>
  <h1>Precios Jordan</h1>
  <p class="sub" id="updated">Cargando…</p>
  <input class="search" id="q" type="search" placeholder="Busca: jordan 1 low, jordan 4 negras, sudadera…" autocomplete="off" aria-label="Buscar">
  <div class="filters">
    <label>Tipo <select id="f-cat"><option value="">Todo</option><option value="zapatillas">Zapatillas</option><option value="ropa">Ropa y accesorios</option></select></label>
    <label>Hasta <input id="f-max" type="number" min="0" step="10" value="150"> €</label>
    <label><input id="f-size" type="checkbox" checked> Solo con talla 43 o 44 (zapatillas)</label>
    <label>Orden <select id="f-sort"><option value="price">Precio</option><option value="discount">Mayor descuento</option><option value="stores">Más tiendas</option><option value="new">Novedades</option></select></label>
  </div>
  <p class="count" id="count"></p>
  <div id="list"></div>
  <button class="more" id="more" hidden>Ver más</button>
</main>
<script>
const PAGE = 40;
const eur = v => v == null ? "–" : v.toLocaleString("es-ES", { style: "currency", currency: "EUR" });
const day = iso => iso ? iso.slice(0, 10) : "";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
const STALE_DAYS = 7;

async function load(path) {
  const r = await fetch(path, { cache: "no-store" });
  if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
  return r.json();
}

// Abreviaturas y colores en español para el buscador.
function aliases(t) {
  const n = norm(t), out = [];
  const add = (c, ...w) => { if (c) out.push(...w); };
  add(/\bair jordan 1\b|\bjordan 1\b/.test(n), "aj1", "j1");
  add(/\bair jordan 4\b|\bjordan 4\b/.test(n), "aj4", "j4");
  add(/\bair jordan 3\b|\bjordan 3\b/.test(n), "aj3", "j3");
  add(/black|negr/.test(n), "negra", "negras", "negro");
  add(/white|sail|blanc/.test(n), "blanca", "blancas", "blanco");
  add(/red|rojo|infrared|bred|cherry/.test(n), "roja", "rojas", "rojo");
  add(/blue|azul|royal/.test(n), "azul", "azules");
  add(/green|verde/.test(n), "verde", "verdes");
  add(/grey|gray|gris|cement/.test(n), "gris", "grises");
  add(/\b(gs|ps|td)\b/.test(n), "nino", "ninos", "kids");
  add(/women|mujer/.test(n), "mujer");
  return out;
}

function render(latest, history) {
  const storeIds = Object.keys(latest.stores);
  const storeName = Object.fromEntries(storeIds.map(id => [id, latest.stores[id].name]));
  const color = Object.fromEntries(storeIds.map((id, i) => [id, `--s${(i % 8) + 1}`]));
  const updated = new Date(latest.updated);
  document.getElementById("updated").textContent =
    `Última actualización: ${updated.toLocaleString("es-ES", { timeZone: "Europe/Madrid" })} · ` +
    storeIds.map(id => `${storeName[id]} (${latest.stores[id].status === "ok" ? latest.stores[id].count : latest.stores[id].status})`).join(" · ");

  const cutoff = new Date(updated.getTime() - STALE_DAYS * 864e5).toISOString();
  const products = Object.values(latest.products).map(p => {
    const offers = Object.entries(p.offers).filter(([, o]) => o.last_seen >= cutoff).map(([store, o]) => ({ store, ...o }));
    offers.sort((a, b) => (b.available - a.available) || a.price - b.price);
    const live = offers.filter(o => o.available);
    const best = live[0] || null;
    const ref = Math.max(0, ...offers.map(o => o.compare_at || 0), ...offers.map(o => o.price));
    const disc = best && ref > best.price ? (ref - best.price) / ref * 100 : 0;
    return { ...p, offers, best, disc, size43: live.some(o => o.s43), size44: live.some(o => o.s44),
             search: norm([p.title, p.code, p.category, ...aliases(p.title || "")].join(" ")) };
  }).filter(p => p.best);

  const els = { q: document.getElementById("q"), cat: document.getElementById("f-cat"), max: document.getElementById("f-max"),
                size: document.getElementById("f-size"), sort: document.getElementById("f-sort") };
  const params = new URLSearchParams(location.search);
  if (params.get("q")) els.q.value = params.get("q");
  let shown = 0, filtered = [];

  function apply() {
    const words = norm(els.q.value).split(" ").filter(Boolean);
    const max = parseFloat(els.max.value) || Infinity;
    filtered = products.filter(p =>
      (!els.cat.value || p.category === els.cat.value) &&
      p.best.price <= max &&
      (!els.size.checked || p.category !== "zapatillas" || p.size43 || p.size44) &&
      // Los números van como palabra entera: "jordan 1" no debe encontrar Jordan 11 ni 12.
      words.every(w => /^\d+$/.test(w) ? ` ${p.search} `.includes(` ${w} `) : p.search.includes(w)));
    const sorters = {
      price: (a, b) => a.best.price - b.best.price,
      discount: (a, b) => b.disc - a.disc,
      stores: (a, b) => b.offers.length - a.offers.length || a.best.price - b.best.price,
      new: (a, b) => (b.first_seen || "").localeCompare(a.first_seen || ""),
    };
    filtered.sort(sorters[els.sort.value]);
    document.getElementById("list").innerHTML = "";
    shown = 0;
    more();
    document.getElementById("count").textContent = `${filtered.length} de ${products.length} productos`;
    const url = new URL(location);
    els.q.value ? url.searchParams.set("q", els.q.value) : url.searchParams.delete("q");
    window.history.replaceState(null, "", url);
  }

  function more() {
    const list = document.getElementById("list");
    for (const p of filtered.slice(shown, shown + PAGE)) list.appendChild(card(p));
    shown = Math.min(shown + PAGE, filtered.length);
    document.getElementById("more").hidden = shown >= filtered.length;
  }

  function card(p) {
    const el = document.createElement("details");
    el.className = "card";
    const sizes = p.category === "zapatillas"
      ? ` <span class="tag ${p.size43 ? "ok" : "no"}">43</span> <span class="tag ${p.size44 ? "ok" : "no"}">44</span>` : "";
    el.innerHTML = `
      <summary>
        <span class="title">${p.image ? `<img class="thumb" src="${esc(p.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ""}
          <span><h2>${esc(p.title)}</h2><span class="muted">${esc(p.code || "")}</span></span></span>
        <span class="best-line">desde <strong>${eur(p.best.price)}</strong> en ${esc(storeName[p.best.store])}
          ${p.disc >= 1 ? `<span class="neg">−${p.disc.toFixed(0)} %</span>` : ""}
          · ${p.offers.length} tienda${p.offers.length > 1 ? "s" : ""}${sizes}</span>
      </summary>
      <div class="detail">
        <div class="table-wrap"><table>
          <thead><tr><th>Tienda</th><th class="num">Precio</th><th class="num">Antes</th><th>43</th><th>44</th><th>Stock</th></tr></thead>
          <tbody>${p.offers.map(o => `<tr>
            <td><span class="swatch" style="background:var(${color[o.store]})"></span><a href="${esc(o.url)}" rel="noopener" target="_blank">${esc(storeName[o.store])}</a></td>
            <td class="num ${o === p.best ? "best" : ""}">${eur(o.price)}</td>
            <td class="num muted">${o.compare_at ? eur(o.compare_at) : "–"}</td>
            <td>${p.category === "zapatillas" ? (o.s43 ? "✓" : "–") : ""}</td>
            <td>${p.category === "zapatillas" ? (o.s44 ? "✓" : "–") : ""}</td>
            <td>${o.available ? "sí" : "agotado"}</td></tr>`).join("")}</tbody>
        </table></div>
        <p class="muted" style="margin:8px 0 0">Mínimo visto: ${eur(p.min_price)} (${day(p.min_price_date)}) · en seguimiento desde ${day(p.first_seen)}</p>
        <div class="chart-box"><canvas aria-label="Evolución del precio"></canvas></div>
      </div>`;
    el.addEventListener("toggle", () => {
      if (el.open && !el.dataset.chart) { el.dataset.chart = "1"; chart(el.querySelector("canvas"), p); }
    });
    return el;
  }

  function chart(canvas, p) {
    const series = history[p.key] || {};
    const dates = [...new Set(Object.values(series).flat().map(pt => day(pt[0])))].sort();
    if (dates.length < 2) {
      canvas.parentElement.outerHTML = '<p class="muted">La gráfica aparecerá cuando haya más de un día de datos.</p>';
      return;
    }
    // Histórico por cambios: cada punto vale hasta el siguiente cambio.
    const datasets = Object.entries(series).map(([store, pts]) => {
      const byDay = Object.fromEntries(pts.map(pt => [day(pt[0]), pt[1]]));
      let last = null;
      const c = css(color[store] || "--s1");
      return { label: storeName[store] || store, data: dates.map(d => (last = byDay[d] ?? last)),
               borderColor: c, backgroundColor: c, borderWidth: 2, stepped: true, pointRadius: 0, spanGaps: true };
    });
    const text = css("--text-secondary"), grid = css("--grid");
    new Chart(canvas, {
      type: "line", data: { labels: dates, datasets },
      options: { responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
        plugins: { legend: { position: "bottom", labels: { color: text, boxWidth: 12 } },
                   tooltip: { callbacks: { label: c => `${c.dataset.label}: ${eur(c.parsed.y)}` } } },
        scales: { x: { ticks: { color: text, maxRotation: 0, autoSkip: true }, grid: { display: false } },
                  y: { ticks: { color: text, callback: v => eur(v) }, grid: { color: grid } } } },
    });
  }

  for (const el of Object.values(els)) el.addEventListener(el.tagName === "INPUT" && el.type !== "checkbox" ? "input" : "change", apply);
  document.getElementById("more").addEventListener("click", more);
  apply();
}

Promise.all([load("data/sneakers_latest.json"), load("data/sneakers_history.json")])
  .then(([latest, history]) => render(latest, history))
  .catch(err => { document.getElementById("updated").textContent = `No se pudieron cargar los datos (${err.message}).`; });
</script>
</body>
</html>
