# Worker que sirve guitle.com desde R2 (lo despliega .github/workflows/cloudflare.yml con CLOUDFLARE_API_TOKEN).
name = "guitle"
main = "worker.js"
compatibility_date = "2025-06-15"
workers_dev = false
# Dirección de prueba (Cloudflare crea el DNS y el certificado). guitle.com sigue en GitHub Pages hasta cambiarlo aquí.
routes = [{ pattern = "prueba.guitle.com", custom_domain = true }]

[[r2_buckets]]
binding = "SITE"
bucket_name = "guitle"
